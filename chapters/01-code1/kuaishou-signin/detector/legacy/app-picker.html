<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP 监控选择器</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #000;
        color: #fff;
        -webkit-font-smoothing: antialiased;
    }
    body {
        display: flex; flex-direction: column;
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
    }
    header {
        padding: 18px 16px 8px 16px;
        background: #000;
        position: sticky; top: 0; z-index: 10;
    }
    h1 {
        font-size: 22px; font-weight: 600;
        margin: 0 0 4px 0; letter-spacing: 0.2px;
    }
    .sub {
        font-size: 13px; color: #8e8e93; margin: 0 0 14px 0;
    }
    .search-wrap { position: relative; }
    .search {
        width: 100%;
        background: #1c1c1e;
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        padding: 10px 14px 10px 36px;
        outline: none;
    }
    .search::placeholder { color: #6e6e73; }
    .search-icon {
        position: absolute; left: 12px; top: 50%;
        transform: translateY(-50%);
        color: #6e6e73; font-size: 14px; pointer-events: none;
    }

    .toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 16px;
        font-size: 13px;
        color: #8e8e93;
    }
    .toolbar .pill {
        background: #1c1c1e; color: #fff;
        padding: 6px 12px; border-radius: 999px;
        cursor: pointer; user-select: none;
        transition: background 0.15s;
    }
    .toolbar .pill:hover { background: #2c2c2e; }
    .toolbar .pill:active { background: #3a3a3c; }
    .toolbar .count { margin-left: auto; }
    .toolbar .count b { color: #0a84ff; font-weight: 600; }

    .list {
        flex: 1;
        overflow-y: auto;
        padding: 0 0 100px 0;
    }
    .item {
        display: flex; align-items: center;
        padding: 10px 16px;
        cursor: pointer;
        transition: background 0.1s;
        gap: 14px;
    }
    .item:hover { background: #1c1c1e; }
    .item:active { background: #2c2c2e; }
    .item.selected { background: #0a84ff22; }
    .item.selected .check {
        background: #0a84ff; border-color: #0a84ff;
    }
    .item.selected .check::after { opacity: 1; }
    .item.selected .icon { box-shadow: 0 0 0 2px #0a84ff; }

    .icon {
        width: 44px; height: 44px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 600;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        user-select: none;
    }
    .meta { flex: 1; min-width: 0; }
    .name {
        font-size: 15px; font-weight: 500;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        color: #fff;
    }
    .pkg {
        font-size: 12px; color: #8e8e93;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        margin-top: 2px;
    }
    .check {
        width: 22px; height: 22px;
        border-radius: 50%;
        border: 1.5px solid #48484a;
        flex-shrink: 0;
        position: relative;
        transition: all 0.15s;
    }
    .check::after {
        content: "";
        position: absolute;
        left: 6px; top: 2px;
        width: 5px; height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        opacity: 0;
        transition: opacity 0.15s;
    }

    .empty {
        text-align: center;
        color: #6e6e73;
        padding: 60px 20px;
        font-size: 14px;
    }

    .actions {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(28, 28, 30, 0.95);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-top: 1px solid #2c2c2e;
        padding: 12px 16px;
        display: flex; gap: 10px; align-items: center;
        z-index: 20;
        max-width: 560px;
        margin: 0 auto;
    }
    .btn {
        flex: 1;
        background: #0a84ff;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 16px; font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #3a3a3c; color: #8e8e73; cursor: not-allowed; }
    .btn-secondary {
        background: #3a3a3c;
        color: #fff;
        flex: 0 0 auto;
        padding: 14px 18px;
    }

    .toast {
        position: fixed; top: 80px; left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: rgba(28, 28, 30, 0.95);
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 14px;
        opacity: 0;
        transition: all 0.25s;
        z-index: 100;
        pointer-events: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .info-bar {
        padding: 8px 16px;
        font-size: 11px;
        color: #6e6e73;
        text-align: center;
        border-top: 1px solid #1c1c1e;
        background: #0a0a0a;
    }
    .info-bar code {
        background: #1c1c1e;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: ui-monospace, Consolas, monospace;
        color: #aeaeb2;
    }
</style>
</head>
<body>
<header>
    <h1>选择要监控的 APP</h1>
    <p class="sub">点亮蓝圈 = 每天没打开就提醒</p>
    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search" id="search" placeholder="搜索 APP 名或包名">
    </div>
</header>

<div class="toolbar">
    <span class="pill" id="toggleAll">全选</span>
    <span class="pill" id="toggleNone">清空</span>
    <span class="count">已选 <b id="count">0</b> 个 / 共 <span id="total">0</span></span>
</div>

<div class="list" id="list">
    <div class="empty">加载中…</div>
</div>

<div class="actions">
    <button class="btn btn-secondary" id="copyBtn">复制 JSON</button>
    <button class="btn" id="saveBtn" disabled>保存为 apps.json</button>
</div>

<div class="info-bar">
    保存后把 <code>apps.json</code> 放到 <code>detector\</code> 目录，然后跑 <code>push-config.ps1</code> 推到手机
</div>

<div class="toast" id="toast"></div>

<script>
const APPS = [{"pkg":"org.autojs.autoxjs.v7","name":"Autox.js v7"},{"pkg":"com.kuaishou.nebula","name":"快手极速版"}];

function colorFor(pkg) {
    let h = 0;
    for (let i = 0; i < pkg.length; i++) {
        h = (h * 31 + pkg.charCodeAt(i)) >>> 0;
    }
    const hue = h % 360;
    return 'linear-gradient(135deg, hsl(' + hue + ', 65%, 50%), hsl(' + ((hue + 30) % 360) + ', 65%, 40%))';
}

function initialFor(name) {
    if (!name) return '?';
    const c = name.trim().charAt(0);
    return c.toUpperCase();
}

const state = new Set();

function render(filter) {
    const list = document.getElementById('list');
    const f = (filter || '').toLowerCase().trim();
    const filtered = f
        ? APPS.filter(function(a) { return a.name.toLowerCase().indexOf(f) >= 0 || a.pkg.toLowerCase().indexOf(f) >= 0; })
        : APPS;

    if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">没有匹配的 APP</div>';
        return;
    }

    const frag = document.createDocumentFragment();
    for (let i = 0; i < filtered.length; i++) {
        const a = filtered[i];
        const div = document.createElement('div');
        div.className = 'item' + (state.has(a.pkg) ? ' selected' : '');
        div.dataset.pkg = a.pkg;
        div.innerHTML =
            '<div class="icon" style="background:' + colorFor(a.pkg) + '">' + escapeHtml(initialFor(a.name)) + '</div>' +
            '<div class="meta">' +
                '<div class="name">' + escapeHtml(a.name) + '</div>' +
                '<div class="pkg">' + escapeHtml(a.pkg) + '</div>' +
            '</div>' +
            '<div class="check"></div>';
        div.onclick = (function(p) { return function() { toggle(p); }; })(a.pkg);
        frag.appendChild(div);
    }
    list.innerHTML = '';
    list.appendChild(frag);
}

function toggle(pkg) {
    if (state.has(pkg)) state.delete(pkg);
    else state.add(pkg);
    updateUI();
}

function selectAll() {
    const f = (document.getElementById('search').value || '').toLowerCase().trim();
    const filtered = f
        ? APPS.filter(function(a) { return a.name.toLowerCase().indexOf(f) >= 0 || a.pkg.toLowerCase().indexOf(f) >= 0; })
        : APPS;
    for (let i = 0; i < filtered.length; i++) state.add(filtered[i].pkg);
    updateUI();
}

function selectNone() {
    state.clear();
    updateUI();
}

function updateUI() {
    const items = document.querySelectorAll('.item');
    for (let i = 0; i < items.length; i++) {
        const el = items[i];
        el.classList.toggle('selected', state.has(el.dataset.pkg));
    }
    document.getElementById('count').textContent = state.size;
    document.getElementById('total').textContent = APPS.length;
    document.getElementById('saveBtn').disabled = state.size === 0;
    document.getElementById('toggleAll').textContent = state.size === APPS.length ? '全不选' : '全选';
}

function getJson() {
    const selected = [];
    for (let i = 0; i < APPS.length; i++) {
        if (state.has(APPS[i].pkg)) selected.push({ name: APPS[i].name, pkg: APPS[i].pkg });
    }
    return JSON.stringify({ apps: selected, updated: Date.now() }, null, 2);
}

function saveJson() {
    const json = getJson();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'apps.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已保存 apps.json');
}

async function copyJson() {
    const json = getJson();
    try {
        await navigator.clipboard.writeText(json);
        showToast('已复制到剪贴板');
    } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = json;
        ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('已复制'); } catch (e2) { showToast('复制失败'); }
        document.body.removeChild(ta);
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('show'); }, 1800);
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
}

document.getElementById('search').oninput = function(e) { render(e.target.value); };
document.getElementById('saveBtn').onclick = saveJson;
document.getElementById('copyBtn').onclick = copyJson;
document.getElementById('toggleAll').onclick = function() {
    if (state.size === APPS.length) selectNone();
    else selectAll();
};
document.getElementById('toggleNone').onclick = selectNone;

render('');
updateUI();
</script>
</body>
</html>
